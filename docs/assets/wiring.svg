<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrowPwr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d04040"/>
    </marker>
    <style>
      .title{font-size:30px;font-weight:700;fill:#16324f}
      .sub{font-size:16px;fill:#5a6b7b}
      .modT{font-size:18px;font-weight:700;fill:#16324f}
      .modS{font-size:13px;fill:#5a6b7b}
      .pin{font-size:14px;fill:#22303f;font-family:Consolas,monospace}
      .mpin{font-size:14.5px;fill:#16324f;font-family:Consolas,monospace;font-weight:600}
      .wire{stroke:#33475b;stroke-width:1.8;fill:none}
      .wireLbl{font-size:12px;fill:#33475b;font-family:Consolas,monospace}
      .pwr{stroke:#d04040;stroke-width:2;fill:none}
      .gnd{stroke:#222;stroke-width:2;fill:none}
      .note{font-size:12.5px;fill:#b3261e}
      .mcupin{fill:#eaf1fb;stroke:#3b6ea5;stroke-width:1.4}
      .mpinL{fill:#eef2f7;stroke:#9fb2c6;stroke-width:1}
      .legend{font-size:13.5px;fill:#33475b}
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1080" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="46" text-anchor="middle" class="title">智能护眼台灯 · 硬件接线示意图</text>
  <text x="800" y="74" text-anchor="middle" class="sub">主控 STM32F103RC（Cortex-M3 @72MHz）· 引脚分配严格对应固件源码</text>

  <!-- ===================== MCU ===================== -->
  <rect x="680" y="300" width="280" height="520" rx="12" fill="#16324f" stroke="#0d2236" stroke-width="2"/>
  <rect x="680" y="300" width="280" height="46" rx="12" fill="#0d2236"/>
  <rect x="680" y="334" width="280" height="12" fill="#0d2236"/>
  <text x="820" y="330" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">STM32F103RC</text>
  <text x="820" y="372" text-anchor="middle" font-size="13" fill="#9fc0e6">LQFP64 · Cortex-M3</text>

  <!-- Left pin stubs -->
  <g class="mcupin">
    <rect x="664" y="392" width="16" height="16"/><rect x="664" y="442" width="16" height="16"/>
    <rect x="664" y="492" width="16" height="16"/><rect x="664" y="560" width="16" height="16"/>
    <rect x="664" y="600" width="16" height="16"/><rect x="664" y="680" width="16" height="16"/>
    <rect x="664" y="720" width="16" height="16"/>
  </g>
  <!-- Left pin labels INSIDE chip -->
  <g text-anchor="start" fill="#cfe0f5" font-family="Consolas,monospace" font-size="14" font-weight="600">
    <text x="696" y="405">PA0</text><text x="696" y="455">PB8</text><text x="696" y="505">NRST</text>
    <text x="696" y="573">PA9</text><text x="696" y="613">PA10</text>
    <text x="696" y="693">PA13</text><text x="696" y="733">PA14</text>
  </g>

  <!-- Right pin stubs -->
  <g class="mcupin">
    <rect x="960" y="392" width="16" height="16"/>
    <rect x="960" y="432" width="16" height="16"/><rect x="960" y="454" width="16" height="16"/><rect x="960" y="476" width="16" height="16"/>
    <rect x="960" y="556" width="16" height="16"/><rect x="960" y="576" width="16" height="16"/><rect x="960" y="596" width="16" height="16"/>
    <rect x="960" y="616" width="16" height="16"/><rect x="960" y="636" width="16" height="16"/><rect x="960" y="656" width="16" height="16"/>
    <rect x="960" y="676" width="16" height="16"/>
    <rect x="960" y="712" width="16" height="16"/><rect x="960" y="740" width="16" height="16"/>
  </g>
  <!-- Right pin labels INSIDE chip, right aligned -->
  <g text-anchor="end" fill="#cfe0f5" font-family="Consolas,monospace" font-size="14" font-weight="600">
    <text x="944" y="405">PB0</text>
    <text x="944" y="445">PC0</text><text x="944" y="467">PC1</text><text x="944" y="489">PC2</text>
    <text x="944" y="569">PB13</text><text x="944" y="589">PB15</text><text x="944" y="609">PB14</text>
    <text x="944" y="629">PB10</text><text x="944" y="649">PB11</text><text x="944" y="669">PB12</text>
    <text x="944" y="689">PC6</text>
    <text x="944" y="725">PA2</text><text x="944" y="753">PA3</text>
  </g>

  <!-- ===================== LEFT modules ===================== -->
  <rect x="120" y="378" width="230" height="44" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="235" y="398" text-anchor="middle" class="modT">KEY1 亮度 +</text>
  <text x="235" y="415" text-anchor="middle" class="modS">按下高电平 · 10ms 消抖</text>

  <rect x="120" y="428" width="230" height="44" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="235" y="448" text-anchor="middle" class="modT">KEY2 亮度 −</text>
  <text x="235" y="465" text-anchor="middle" class="modS">按下低电平 · 10ms 消抖</text>

  <rect x="120" y="478" width="230" height="44" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="235" y="498" text-anchor="middle" class="modT">复位按键 RESET</text>
  <text x="235" y="515" text-anchor="middle" class="modS">10kΩ 上拉 + 100nF</text>

  <rect x="90" y="540" width="280" height="66" rx="10" fill="#eef1f4" stroke="#7a8794" stroke-width="2"/>
  <text x="230" y="566" text-anchor="middle" class="modT">USART1 调试串口</text>
  <text x="230" y="585" text-anchor="middle" class="modS">CH340 ↔ PC · 115200-8-N-1</text>
  <text x="230" y="601" text-anchor="middle" class="modS">printf 日志 / 上位机指令</text>

  <rect x="90" y="660" width="280" height="66" rx="10" fill="#eef1f4" stroke="#7a8794" stroke-width="2"/>
  <text x="230" y="686" text-anchor="middle" class="modT">ST-Link V2（SWD）</text>
  <text x="230" y="705" text-anchor="middle" class="modS">SWDIO · SWCLK · 3.3V · GND</text>
  <text x="230" y="721" text-anchor="middle" class="modS">程序烧录与在线调试</text>

  <!-- Left wires (all horizontal, labels are inside MCU) -->
  <path class="wire" d="M350,400 H664"/>
  <path class="wire" d="M350,450 H664"/>
  <path class="wire" d="M350,500 H664"/>
  <path class="wire" d="M370,568 H664"/>
  <path class="wire" d="M370,608 H664"/>
  <path class="wire" d="M370,688 H664"/>
  <path class="wire" d="M370,728 H664"/>

  <!-- ===================== RIGHT modules ===================== -->
  <!-- Power LED -->
  <rect x="1230" y="372" width="290" height="56" rx="10" fill="#fdeedd" stroke="#d9651b" stroke-width="2"/>
  <text x="1375" y="396" text-anchor="middle" class="modT">功率 LED 灯珠（3W 暖白）</text>
  <text x="1375" y="416" text-anchor="middle" class="modS">PB0 → 1kΩ → N-MOS 栅极 · 1kHz PWM</text>
  <path class="wire" d="M976,400 H1230"/>

  <!-- Status LEDs -->
  <rect x="1230" y="428" width="290" height="72" rx="10" fill="#fff5d6" stroke="#d9a51b" stroke-width="2"/>
  <text x="1375" y="454" text-anchor="middle" class="modT">状态指示灯 ×3</text>
  <text x="1375" y="474" text-anchor="middle" class="modS">PC0 / PC1 / PC2</text>
  <text x="1375" y="491" text-anchor="middle" class="modS">推挽输出 · 低电平点亮</text>
  <path class="wire" d="M976,440 H1230"/>
  <path class="wire" d="M976,462 H1230"/>
  <path class="wire" d="M976,484 H1230"/>

  <!-- TFT -->
  <rect x="1210" y="508" width="320" height="192" rx="10" fill="#efe6fb" stroke="#7a4fd0" stroke-width="2"/>
  <text x="1370" y="532" text-anchor="middle" class="modT">TFT 彩屏 ST7735S</text>
  <text x="1370" y="552" text-anchor="middle" class="modS">1.8″ · 128×160 · RGB565 · 硬件 SPI2</text>
  <!-- module-side pin pads + labels, aligned to MCU stubs -->
  <g>
    <rect x="1210" y="556" width="10" height="16" class="mpinL"/><text x="1230" y="569" class="mpin">SCK   PB13</text>
    <rect x="1210" y="576" width="10" height="16" class="mpinL"/><text x="1230" y="589" class="mpin">MOSI  PB15</text>
    <rect x="1210" y="596" width="10" height="16" class="mpinL"/><text x="1230" y="609" class="mpin">MISO  PB14</text>
    <rect x="1210" y="616" width="10" height="16" class="mpinL"/><text x="1230" y="629" class="mpin">CS    PB10</text>
    <rect x="1210" y="636" width="10" height="16" class="mpinL"/><text x="1230" y="649" class="mpin">DC    PB11</text>
    <rect x="1210" y="656" width="10" height="16" class="mpinL"/><text x="1230" y="669" class="mpin">RES   PB12</text>
    <rect x="1210" y="676" width="10" height="16" class="mpinL"/><text x="1230" y="689" class="mpin">BLK   PC6</text>
  </g>
  <path class="wire" d="M976,564 H1210"/>
  <path class="wire" d="M976,584 H1210"/>
  <path class="wire" d="M976,604 H1210"/>
  <path class="wire" d="M976,624 H1210"/>
  <path class="wire" d="M976,644 H1210"/>
  <path class="wire" d="M976,664 H1210"/>
  <path class="wire" d="M976,684 H1210"/>

  <!-- MY1680 -->
  <rect x="1210" y="710" width="320" height="132" rx="10" fill="#e2f6f8" stroke="#1b9aa6" stroke-width="2"/>
  <text x="1370" y="734" text-anchor="middle" class="modT">MY1680 语音模块</text>
  <text x="1370" y="754" text-anchor="middle" class="modS">USART2 9600-8-N-1 · TF 卡 · 3W/4Ω 喇叭</text>
  <text x="1230" y="780" class="mpin">MCU PA2(TX) → 模块 RX</text>
  <text x="1230" y="802" class="mpin">MCU PA3(RX) ← 模块 TX</text>
  <text x="1230" y="828" class="note">BUSY 固件定义在 PB11，与 TFT_DC 复用，建议改接空闲 IO</text>
  <path class="wire" d="M976,720 H1120 V776 H1210"/>
  <path class="wire" d="M976,748 H1140 V798 H1210"/>
  <path d="M976,644 H1080 V824 H1210" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/>

  <!-- ===================== POWER ===================== -->
  <rect x="120" y="900" width="150" height="56" rx="10" fill="#fdecec" stroke="#d04040" stroke-width="2"/>
  <text x="195" y="924" text-anchor="middle" class="modT">USB / Type-C</text>
  <text x="195" y="943" text-anchor="middle" class="modS">5V 供电</text>

  <rect x="360" y="900" width="170" height="56" rx="10" fill="#fdecec" stroke="#d04040" stroke-width="2"/>
  <text x="445" y="924" text-anchor="middle" class="modT">AMS1117-3.3</text>
  <text x="445" y="943" text-anchor="middle" class="modS">5V → 3.3V LDO</text>
  <path class="pwr" d="M270,928 H360" marker-end="url(#arrowPwr)"/>
  <text x="315" y="920" text-anchor="middle" class="wireLbl" fill="#d04040">+5V</text>

  <line x1="530" y1="912" x2="1500" y2="912" class="pwr"/>
  <text x="540" y="904" class="mpin" fill="#d04040">+3.3V</text>
  <path class="pwr" d="M530,928 V912"/>
  <line x1="530" y1="944" x2="1500" y2="944" class="gnd"/>
  <text x="540" y="962" class="mpin">GND</text>
  <path class="gnd" d="M445,956 V944"/>
  <path class="gnd" d="M195,956 V944 H445"/>

  <text x="820" y="992" text-anchor="middle" class="sub">+3.3V / GND 统一为 MCU、TFT、MY1680、指示灯、按键上拉供电；功率 LED 由 +5V 经 MOS 管驱动（去耦电容 100nF + 10µF）。</text>

  <!-- ===================== Legend ===================== -->
  <g>
    <rect x="120" y="108" width="560" height="150" rx="10" fill="#f7f9fb" stroke="#d6dee6"/>
    <text x="136" y="134" class="modT">图例 / 关键参数</text>
    <line x1="136" y1="152" x2="172" y2="152" class="wire"/><text x="180" y="156" class="legend">GPIO / 通信信号线</text>
    <line x1="420" y1="152" x2="456" y2="152" class="pwr"/><text x="464" y="156" class="legend">+3.3V / +5V 电源</text>
    <line x1="136" y1="178" x2="172" y2="178" class="gnd"/><text x="180" y="182" class="legend">GND 地</text>
    <line x1="420" y1="178" x2="456" y2="178" stroke="#b3261e" stroke-width="1.8" stroke-dasharray="6 5"/><text x="464" y="182" class="legend">引脚复用（需注意）</text>
    <text x="136" y="208" class="legend">• PWM：TIM3_CH3 / PB0，PSC=71、ARR=999 → 1kHz，CCR = 亮度×10</text>
    <text x="136" y="230" class="legend">• 亮度档位：0 / 25 / 50 / 75 / 100%，对应 TF 卡 01 目录 006/002~005 语音</text>
    <text x="136" y="252" class="legend">• 时钟：8MHz HSE 经 PLL 倍频至 72MHz；SysTick 1ms</text>
  </g>
</svg>
