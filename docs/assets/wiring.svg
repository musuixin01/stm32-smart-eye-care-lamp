<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrowPwr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d04040"/>
    </marker>
    <style>
      .title{font-size:30px;font-weight:700;fill:#16324f}
      .sub{font-size:16px;fill:#5a6b7b}
      .modT{font-size:18px;font-weight:700;fill:#16324f}
      .modS{font-size:13px;fill:#5a6b7b}
      .mpin{font-size:14.5px;fill:#16324f;font-family:Consolas,monospace;font-weight:600}
      .wire{stroke:#33475b;stroke-width:1.8;fill:none}
      .pwr{stroke:#d04040;stroke-width:2;fill:none}
      .gnd{stroke:#222;stroke-width:2;fill:none}
      .note{font-size:12.5px;fill:#b3261e}
      .mcupin{fill:#eaf1fb;stroke:#3b6ea5;stroke-width:1.4}
      .mpinL{fill:#eef2f7;stroke:#9fb2c6;stroke-width:1}
      .legend{font-size:13.5px;fill:#33475b}
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1080" fill="#ffffff"/>

  <text x="800" y="46" text-anchor="middle" class="title">智能护眼台灯 · 硬件接线示意图</text>
  <text x="800" y="74" text-anchor="middle" class="sub">主控 STM32F103C8T6（Cortex-M3 @72MHz）· 1.8″ ST7735S 彩屏（FPC）· 引脚按实际工程核对</text>

  <!-- ===================== MCU ===================== -->
  <rect x="680" y="300" width="280" height="520" rx="12" fill="#16324f" stroke="#0d2236" stroke-width="2"/>
  <rect x="680" y="300" width="280" height="46" rx="12" fill="#0d2236"/>
  <rect x="680" y="334" width="280" height="12" fill="#0d2236"/>
  <text x="820" y="330" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">STM32F103C8T6</text>
  <text x="820" y="372" text-anchor="middle" font-size="13" fill="#9fc0e6">LQFP48 · Cortex-M3</text>

  <!-- Left pin stubs -->
  <g class="mcupin">
    <rect x="664" y="392" width="16" height="16"/><rect x="664" y="442" width="16" height="16"/>
    <rect x="664" y="492" width="16" height="16"/><rect x="664" y="660" width="16" height="16"/>
    <rect x="664" y="700" width="16" height="16"/>
  </g>
  <g text-anchor="start" fill="#cfe0f5" font-family="Consolas,monospace" font-size="14" font-weight="600">
    <text x="696" y="405">PB6</text><text x="696" y="455">PB7</text><text x="696" y="505">NRST</text>
    <text x="696" y="673">PA13</text><text x="696" y="713">PA14</text>
  </g>

  <!-- Right pin stubs -->
  <g class="mcupin">
    <rect x="960" y="392" width="16" height="16"/>
    <rect x="960" y="543" width="16" height="16"/><rect x="960" y="565" width="16" height="16"/><rect x="960" y="587" width="16" height="16"/>
    <rect x="960" y="609" width="16" height="16"/><rect x="960" y="631" width="16" height="16"/><rect x="960" y="653" width="16" height="16"/>
    <rect x="960" y="676" width="16" height="16"/><rect x="960" y="696" width="16" height="16"/><rect x="960" y="716" width="16" height="16"/>
  </g>
  <g text-anchor="end" fill="#cfe0f5" font-family="Consolas,monospace" font-size="14" font-weight="600">
    <text x="944" y="405">PA9</text>
    <text x="944" y="556">PB13</text><text x="944" y="578">PB15</text><text x="944" y="600">PB12</text>
    <text x="944" y="622">PB10</text><text x="944" y="644">PB9</text><text x="944" y="666">PB8</text>
    <text x="944" y="689">PA2</text><text x="944" y="709">PA3</text><text x="944" y="729">PA4</text>
  </g>

  <!-- ===================== LEFT modules ===================== -->
  <rect x="120" y="378" width="230" height="44" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="235" y="398" text-anchor="middle" class="modT">KEY1 亮度 +</text>
  <text x="235" y="415" text-anchor="middle" class="modS">上拉 · 按下接地（低有效）</text>

  <rect x="120" y="428" width="230" height="44" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="235" y="448" text-anchor="middle" class="modT">KEY2 亮度 −</text>
  <text x="235" y="465" text-anchor="middle" class="modS">上拉 · 按下接地（低有效）</text>

  <rect x="120" y="478" width="230" height="44" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="235" y="498" text-anchor="middle" class="modT">复位按键 RESET</text>
  <text x="235" y="515" text-anchor="middle" class="modS">10kΩ 上拉 + 100nF</text>

  <rect x="90" y="640" width="280" height="66" rx="10" fill="#eef1f4" stroke="#7a8794" stroke-width="2"/>
  <text x="230" y="666" text-anchor="middle" class="modT">ST-Link V2（SWD）</text>
  <text x="230" y="685" text-anchor="middle" class="modS">SWDIO · SWCLK · 3.3V · GND</text>
  <text x="230" y="701" text-anchor="middle" class="modS">程序烧录与在线调试</text>

  <path class="wire" d="M350,400 H664"/>
  <path class="wire" d="M350,450 H664"/>
  <path class="wire" d="M350,500 H664"/>
  <path class="wire" d="M370,668 H664"/>
  <path class="wire" d="M370,708 H664"/>

  <!-- ===================== RIGHT modules ===================== -->
  <!-- Power LED -->
  <rect x="1230" y="372" width="290" height="56" rx="10" fill="#fdeedd" stroke="#d9651b" stroke-width="2"/>
  <text x="1375" y="396" text-anchor="middle" class="modT">功率 LED 灯珠（3W 暖白）</text>
  <text x="1375" y="416" text-anchor="middle" class="modS">PA9 → 10kΩ → SS8050 → LED</text>
  <path class="wire" d="M976,400 H1230"/>

  <!-- TFT -->
  <rect x="1210" y="488" width="320" height="180" rx="10" fill="#efe6fb" stroke="#7a4fd0" stroke-width="2"/>
  <text x="1370" y="512" text-anchor="middle" class="modT">TFT 彩屏 ST7735S（8P FPC）</text>
  <text x="1370" y="532" text-anchor="middle" class="modS">1.8″ · 128×160 · RGB565 · 硬件 SPI2</text>
  <g>
    <rect x="1210" y="543" width="10" height="16" class="mpinL"/><text x="1230" y="556" class="mpin">SCL   PB13</text>
    <rect x="1210" y="565" width="10" height="16" class="mpinL"/><text x="1230" y="578" class="mpin">SDA   PB15</text>
    <rect x="1210" y="587" width="10" height="16" class="mpinL"/><text x="1230" y="600" class="mpin">CS    PB12</text>
    <rect x="1210" y="609" width="10" height="16" class="mpinL"/><text x="1230" y="622" class="mpin">RS/DC PB10</text>
    <rect x="1210" y="631" width="10" height="16" class="mpinL"/><text x="1230" y="644" class="mpin">RESET PB9</text>
    <rect x="1210" y="653" width="10" height="16" class="mpinL"/><text x="1230" y="666" class="mpin">BLK   PB8</text>
  </g>
  <path class="wire" d="M976,551 H1210"/>
  <path class="wire" d="M976,573 H1210"/>
  <path class="wire" d="M976,595 H1210"/>
  <path class="wire" d="M976,617 H1210"/>
  <path class="wire" d="M976,639 H1210"/>
  <path class="wire" d="M976,661 H1210"/>

  <!-- MY1680 -->
  <rect x="1210" y="684" width="320" height="116" rx="10" fill="#e2f6f8" stroke="#1b9aa6" stroke-width="2"/>
  <text x="1370" y="708" text-anchor="middle" class="modT">MY1680 语音模块</text>
  <text x="1370" y="728" text-anchor="middle" class="modS">USART2 9600-8-N-1 · TF 卡 · 3W/4Ω 喇叭</text>
  <text x="1230" y="754" class="mpin">MCU PA2(TX) → 模块 RX</text>
  <text x="1230" y="776" class="mpin">MCU PA3(RX) ← 模块 TX</text>
  <text x="1230" y="798" class="mpin">BUSY PA4</text>
  <path class="wire" d="M976,684 H1120 V750 H1210"/>
  <path class="wire" d="M976,704 H1140 V772 H1210"/>
  <path class="wire" d="M976,724 H1160 V794 H1210"/>

  <!-- ===================== POWER ===================== -->
  <rect x="120" y="900" width="150" height="56" rx="10" fill="#fdecec" stroke="#d04040" stroke-width="2"/>
  <text x="195" y="924" text-anchor="middle" class="modT">USB / Type-C</text>
  <text x="195" y="943" text-anchor="middle" class="modS">5V 供电（仅供电）</text>

  <rect x="360" y="900" width="170" height="56" rx="10" fill="#fdecec" stroke="#d04040" stroke-width="2"/>
  <text x="445" y="924" text-anchor="middle" class="modT">AMS1117-3.3</text>
  <text x="445" y="943" text-anchor="middle" class="modS">5V → 3.3V LDO</text>
  <path class="pwr" d="M270,928 H360" marker-end="url(#arrowPwr)"/>
  <text x="315" y="920" text-anchor="middle" class="mpin" fill="#d04040">+5V</text>

  <line x1="530" y1="912" x2="1500" y2="912" class="pwr"/>
  <text x="540" y="904" class="mpin" fill="#d04040">+3.3V</text>
  <path class="pwr" d="M530,928 V912"/>
  <line x1="530" y1="944" x2="1500" y2="944" class="gnd"/>
  <text x="540" y="962" class="mpin">GND</text>
  <path class="gnd" d="M445,956 V944"/>
  <path class="gnd" d="M195,956 V944 H445"/>

  <text x="820" y="992" text-anchor="middle" class="sub">+3.3V / GND 统一为 MCU、TFT、MY1680、按键上拉供电；功率 LED 由 +5V 经 SS8050 低边开关驱动（去耦电容 100nF + 10µF）。</text>

  <!-- ===================== Legend ===================== -->
  <g>
    <rect x="120" y="108" width="580" height="158" rx="10" fill="#f7f9fb" stroke="#d6dee6"/>
    <text x="136" y="134" class="modT">图例 / 关键参数</text>
    <line x1="136" y1="152" x2="172" y2="152" class="wire"/><text x="180" y="156" class="legend">GPIO / 通信信号线</text>
    <line x1="430" y1="152" x2="466" y2="152" class="pwr"/><text x="474" y="156" class="legend">+3.3V / +5V 电源</text>
    <line x1="136" y1="178" x2="172" y2="178" class="gnd"/><text x="180" y="182" class="legend">GND 地</text>
    <text x="430" y="182" class="legend">8P FPC 屏：VDD=3.3V · LEDA 经 47Ω 限流</text>
    <text x="136" y="208" class="legend">• PWM 调光：TIM1_CH2 / PA9，NPN（SS8050）低边驱动暖白 LED</text>
    <text x="136" y="230" class="legend">• 按键 PB6/PB7：内部上拉（外有 10kΩ），按下接地，软件消抖</text>
    <text x="136" y="252" class="legend">• 时钟：8MHz HSE 经 PLL 倍频至 72MHz；SysTick 1ms</text>
  </g>
</svg>
